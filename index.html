<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Рыбалка Майорка</title>
<meta name="theme-color" content="#0b3b5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="lib/leaflet.css">
<style>
:root{--bg:#f2f5f8;--card:#fff;--ink:#14212b;--muted:#5d6b77;--line:#dde4ea;--pri:#0b6fb8;--pri-ink:#fff;--top:#0b3b5c;--top-ink:#fff;
--good:#1fb36b;--ok:#e0a400;--bad:#e0533d;--no:#9aa3ab;--warn-bg:#fff4e0;--warn-ink:#7a4b00;--danger:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d151c;--card:#16222c;--ink:#e6edf3;--muted:#93a1ad;--line:#26343f;--pri:#3d9be0;
--top:#0a2a41;--warn-bg:#3a2a0c;--warn-ink:#ffd18a;--danger:#ff6b5b}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
body.noscroll{overflow:hidden}a{color:var(--pri)}h1{font-size:20px;margin:0 0 8px}h2{font-size:19px;margin:0 0 4px;padding-right:36px}h3{font-size:15px;margin:16px 0 6px}
.top{background:var(--top);color:var(--top-ink);padding:14px 16px 10px;padding-top:calc(14px + env(safe-area-inset-top))}.top .sub{font-size:13px;opacity:.85;margin-top:8px}
.top .link{color:#9fd3ff}.top .sub{color:#cfe3f2;padding:0}
.seg{display:flex;background:rgba(255,255,255,.12);border-radius:10px;padding:3px}.seg button{flex:1;border:0;background:none;color:#fff;padding:8px 4px;border-radius:8px;font:inherit;font-size:14px}
.seg button.on{background:#fff;color:var(--top);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}.chip{flex:none;border:1px solid rgba(255,255,255,.35);background:none;color:#fff;border-radius:16px;padding:5px 11px;font:inherit;font-size:13px}
.chip.on{background:#fff;color:var(--top);border-color:#fff}
.list{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.card{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}
.cbody{flex:1;min-width:0}.cname{font-weight:600;font-size:16px}.cname small{font-weight:500;color:var(--pri);font-size:11px;border:1px solid var(--pri);border-radius:6px;padding:0 4px}
.cmeta{font-size:12.5px;color:var(--muted)}.win{font-weight:600;margin-top:4px}.wxline{font-size:13px}
.badge{flex:none;min-width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:17px;color:#fff;background:var(--no)}
.badge.sm{min-width:30px;height:24px;font-size:12px;border-radius:7px;display:inline-grid}
.good{background:var(--good)}.ok{background:var(--ok)}.bad{background:var(--bad)}.no{background:var(--no)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.tags span{font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:1px 7px}
.danger{color:var(--danger);font-size:13px;font-weight:600;margin-top:4px}
.why{font-size:13px;margin:8px 0 2px;color:var(--ink)}.why b{color:var(--good)}
.go{font-size:13px;margin:6px 0 2px;font-weight:600;color:var(--pri)}
.rig{font-size:13px;margin:6px 0 2px;padding:7px 9px;border-radius:9px;background:var(--bg);color:var(--ink);text-align:left}
.qadd{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;color:var(--pri);border:1px solid var(--line);border-radius:14px;padding:5px 12px}.muted{color:var(--muted)}
.note,.warn{margin:10px 12px;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line)}.warn{background:var(--warn-bg);color:var(--warn-ink);border-color:transparent}
.sheet .warn,.sheet .note{margin:8px 0}
.foot{font-size:12px;color:var(--muted);padding:4px 16px 16px}
.arr{display:inline-block;font-weight:700}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:900}
.tabbar button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:11.5px;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button svg{width:24px;height:24px}.tabbar button.on{color:var(--pri);font-weight:600}
#map{height:calc(100vh - 290px - env(safe-area-inset-bottom));min-height:340px;margin:0;position:relative;z-index:0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;text-decoration:none;cursor:pointer}
.top .btn{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}.btn.danger{color:var(--danger)}.btn.wide{width:100%;margin-top:12px}
.link{border:0;background:none;color:var(--pri);font:inherit;padding:0;text-decoration:underline;cursor:pointer}.link.danger{color:var(--danger);font-size:13px;margin-top:4px}
#modal{position:fixed;inset:0;z-index:1000;display:flex;align-items:flex-end}#modal[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet{position:relative;background:var(--card);width:100%;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
.close{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:17px;border:0;background:var(--bg);color:var(--ink);font-size:16px}
.tips{padding-left:18px;margin:6px 0}.tips li{margin:3px 0}
.hours{display:flex;align-items:flex-end;gap:2px;height:90px;margin:8px 0;padding-bottom:16px;position:relative}
.hr{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;position:relative}.hr .bar{border-radius:3px 3px 0 0;width:100%}
.hr .hl{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font-size:9px;color:var(--muted)}.hr.off .bar{background:var(--line);height:4px!important}
table.wx{width:100%;border-collapse:collapse;font-size:13px}table.wx th,table.wx td{padding:5px 3px;border-bottom:1px solid var(--line);text-align:center}table.wx th{color:var(--muted);font-weight:500}
label{display:block;font-size:13px;color:var(--muted);margin-top:10px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.row{display:flex;gap:10px}.row label{flex:1;min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 12px;padding:4px 14px 14px}
.sub{font-size:13px;color:var(--muted);padding:0 16px}
.fishcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.fishcard summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fishcard summary .muted{font-size:12.5px}.fbody ul{padding-left:18px;margin:6px 0}
.pill{margin-left:auto;font-size:11.5px;border-radius:10px;padding:1px 8px;color:#fff}.okp{background:var(--good)}.nop{background:var(--bad)}
.verdict{margin-top:12px;border-radius:10px;padding:10px 12px;color:#fff}.verdict ul{margin:6px 0 0;padding-left:18px}.okv{background:var(--good)}.nov{background:var(--bad)}.chv{background:var(--ok);color:#2a1d00}
.entry{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}.entry img{width:72px;height:72px;object-fit:cover;border-radius:8px;flex:none}
.sbar{display:grid;grid-template-columns:110px 1fr 28px;align-items:center;gap:8px;margin:4px 0;font-size:13px}.sbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sbar i{height:12px;background:var(--pri);border-radius:6px;display:block}
p.lbl{font-weight:600;margin:10px 0 2px}.fishcard .fbody p{margin:6px 0}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}.ck{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:14px;margin-top:4px}.ck input{width:auto;display:inline;margin:0}
.pk{background:#2b6cff;color:#fff;border:2px solid #fff;border-radius:5px;font:700 12px/16px system-ui;text-align:center}
.top .seg{margin-bottom:2px}
img.licimg{display:block;width:100%;border-radius:10px;margin:10px 0;border:1px solid var(--line)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));background:#14212b;color:#fff;padding:12px 14px;border-radius:10px;z-index:1100;text-align:center}
#toast[hidden]{display:none}
#toast{background:var(--ink);color:var(--bg);font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.35)}
</style>
<style id="v2">
/* Дизайн v2 */
:root{--bg:#edf2f6;--card:#fff;--ink:#0f1d26;--muted:#5d6f7d;--line:#dde6ec;--pri:#0b7cc0;--top:#0b3550;--top2:#0f5079;
--good:#16a34a;--ok:#ca8a04;--bad:#ea580c;--no:#94a3ae;--tg-bg:#e3f6ea;--tg:#166534;--tb-bg:#fdeee3;--tb:#9a3412;--shadow:0 1px 2px rgba(15,29,38,.06),0 4px 14px rgba(15,29,38,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#061017;--card:#0e1b24;--ink:#e6eef4;--muted:#8a9eac;--line:#1b2c38;--pri:#4cb3f0;--top:#081a26;--top2:#0b2737;
--good:#22c55e;--ok:#eab308;--bad:#f97316;--no:#5b6b77;--tg-bg:rgba(34,197,94,.13);--tg:#86efac;--tb-bg:rgba(249,115,22,.13);--tb:#fdba74;--shadow:none}}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{background:linear-gradient(180deg,var(--top2),var(--top));padding-bottom:12px}
.top h1{font-size:24px;letter-spacing:-.2px;margin-bottom:10px}
.seg{background:none;border-bottom:1px solid rgba(255,255,255,.14);border-radius:0;padding:0}
.seg button{border-radius:0;padding:9px 4px 10px;color:rgba(255,255,255,.7);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.seg button.on{background:none;color:#fff;border-bottom-color:#5cc2ff}
.chips{gap:7px;margin-top:9px}
.chip{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.07);padding:6px 12px;font-size:13px;color:#e4f0f8}
.chip.on{background:#fff;color:#0b3550;border-color:#fff;font-weight:600}
.top .sub{margin-top:10px;font-size:12.5px;color:#b5cfe0}
.list{gap:10px;padding:12px}
.card{border-radius:16px;padding:14px 14px 12px;gap:14px;box-shadow:var(--shadow);border-color:var(--line)}
.card{flex-wrap:wrap;align-items:center;row-gap:0}.cinfo{flex-basis:100%;min-width:0}.cinfo>.muted{margin-top:6px}.metrics:last-child{border-bottom:0;padding-bottom:0}
.m span .arr{display:inline-block;font-size:12px;margin:0 2px 0 0;line-height:1;vertical-align:-1px}
.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.cname{font-size:16.5px;line-height:1.25;letter-spacing:-.1px}
.wintime{flex:none;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,transparent);border-radius:8px;padding:3px 8px;margin-top:1px}
.cmeta{margin-top:2px}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.m{display:flex;align-items:center;gap:7px;min-width:0}.m>div{min-width:0}
.m i{flex:none;width:26px;height:26px;border-radius:8px;background:var(--bg);display:grid;place-items:center;color:var(--pri)}
.m svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.m b{display:block;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}.m b small{font-size:11px;font-weight:500;color:var(--muted)}
.m span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .arr{font-size:13px;margin-right:1px}
.tags{gap:5px;margin-top:9px}
.tags span{border:0;border-radius:7px;padding:2px 8px;font-size:12px;font-weight:500;background:var(--bg);color:var(--muted)}
.tags span.tg{background:var(--tg-bg);color:var(--tg)}.tags span.tb{background:var(--tb-bg);color:var(--tb)}
.ring{background:none!important;flex:none;position:relative;width:56px;height:56px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}.ring .trk{stroke:var(--line)}.ring .val{stroke-linecap:round}
.ring b{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.ring.good .val{stroke:var(--good)}.ring.good b{color:var(--good)}
.ring.ok .val{stroke:var(--ok)}.ring.ok b{color:var(--ok)}
.ring.bad .val{stroke:var(--bad)}.ring.bad b{color:var(--bad)}
.ring.no b{color:var(--no)}
.tabbar{border-top-color:var(--line);padding-top:4px}
.tabbar button{gap:3px}.tabbar button svg{width:40px;height:26px;padding:3px 9px;border-radius:13px;box-sizing:border-box}
.tabbar button.on svg{background:color-mix(in srgb,var(--pri) 16%,transparent)}
.panel,.fishcard,.entry{border-radius:16px;box-shadow:var(--shadow)}
.btn{border-radius:12px}
</style>
<style id="v3">
/* Дизайн v3 */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#0b1217;--line:#1a252d;--top:#000;--top2:#06141d;--muted:#8697a3}}
.metrics{grid-template-columns:repeat(3,minmax(0,1fr));gap:0;padding:9px 0}
.m{padding:0 8px;border-left:1px solid var(--line)}.m:first-child{border-left:0;padding-left:0}
.m i{background:none!important;width:22px;height:22px}.m svg{width:22px;height:22px;stroke-width:1.6}
.m b{font-size:16px}.m span{white-space:normal;line-height:1.2;overflow:visible}
.ring{width:60px;height:60px}.ring circle{stroke-width:5.5}.ring b{font-size:21px;letter-spacing:-.5px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ring.good svg{filter:drop-shadow(0 0 5px rgba(34,197,94,.55))}
:root:not([data-theme="light"]) .ring.ok svg{filter:drop-shadow(0 0 5px rgba(234,179,8,.5))}:root:not([data-theme="light"]) .ring.bad svg{filter:drop-shadow(0 0 5px rgba(249,115,22,.5))}}
.tags span{display:inline-flex;align-items:center;gap:4px;padding:3px 9px 3px 7px;border-radius:9px}
.tags span svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card.hero{border:1.5px solid color-mix(in srgb,var(--good) 55%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--good) 10%,var(--card)),var(--card) 55%);padding-top:12px}
.card.hero .ring{width:72px;height:72px}.card.hero .ring b{font-size:26px}.card.hero .cname{font-size:18px}
.herolbl{flex-basis:100%;font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--good);margin-bottom:8px}
.wintime{display:inline-flex;align-items:center;gap:4px}
</style>
<style id="v4">
/* Версия 2: новые блоки */
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}.toprow h1{margin-bottom:10px}
.nightbtn{flex:none;width:38px;height:38px;border-radius:19px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:18px;margin-bottom:8px}
.wintime small{font-weight:600;opacity:.8;font-size:11px}
.nearbar{display:block;width:calc(100% - 24px);margin:12px 12px 0;text-align:left;border:0;border-radius:14px;padding:12px 14px;background:linear-gradient(120deg,color-mix(in srgb,var(--good) 22%,var(--card)),var(--card));color:var(--ink);font:inherit;box-shadow:var(--shadow)}
.nearbar b{display:block;font-size:15px}.nearbar span{font-size:13px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 12px 0}.quick .btn{padding:16px 6px;font-size:16px}
.strip{position:relative;height:26px;border-radius:13px;overflow:hidden;margin:8px 0 2px;background:#0b2233}
.strip .sky{position:absolute;inset:0;background:linear-gradient(90deg,#0b2233 0,#0b2233 calc(var(--sr) - 3%),#f59e0b var(--sr),#7cc4ef calc(var(--sr) + 8%),#7cc4ef calc(var(--ss) - 8%),#f97316 var(--ss),#0b2233 calc(var(--ss) + 3%),#0b2233 100%);opacity:.55}
.strip i{position:absolute;top:0;bottom:0}
.strip .maj{background:rgba(34,197,94,.75);top:9px;bottom:9px;border-radius:4px}
.strip .min{background:rgba(234,179,8,.8);top:11px;bottom:11px;border-radius:4px}
.strip .bw{border:2.5px solid #fff;border-radius:8px;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.strip .now{width:2px;background:#ff4d4d}
.striplbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend2{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin:6px 0}
.lg{display:inline-block;width:12px;height:8px;border-radius:3px;margin-right:4px;vertical-align:middle}
.bwl{border:2px solid var(--ink);height:6px}.majl{background:rgba(34,197,94,.8)}.minl{background:rgba(234,179,8,.85)}
.cbl{background:var(--good)}.col{background:color-mix(in srgb,var(--good) 45%,var(--bg))}.cxl{background:color-mix(in srgb,var(--bad) 45%,var(--bg))}
.metrics.sea{margin-top:10px}
.spark{display:block;width:100%;height:auto;margin:2px 0 6px}.spark .nowl{stroke:var(--muted);stroke-dasharray:3 3}.spark .ax{fill:var(--muted);font-size:10px}
.packlist{display:flex;flex-direction:column;gap:2px;margin:6px 0}.packlist .ck{font-size:16px;padding:8px 0;border-bottom:1px solid var(--line)}.packlist input{width:20px;height:20px}
.mk{display:grid!important;place-items:center;border-radius:13px;font-size:14px!important;border:2px solid #fff;color:#fff;font:700 12px/1 system-ui;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.mk-bite{background:#16a34a}.mk-snag{background:#dc2626}.mk-note{background:#7c3aed}
.cal{overflow-x:auto}.cal table{border-collapse:separate;border-spacing:2px;font-size:11px;min-width:520px}
.cal th{font-weight:600;color:var(--muted);padding:2px}.cal th.cur{color:var(--pri)}
.cal td{height:18px;border-radius:4px;min-width:26px}.cal td.fn{white-space:nowrap;padding-right:6px;font-size:12px;height:auto;min-width:0}
.cal .cb{background:var(--good)}.cal .co{background:color-mix(in srgb,var(--good) 45%,var(--bg))}.cal .cx{background:color-mix(in srgb,var(--bad) 45%,var(--bg))}
.cal td.cur{outline:2px solid var(--pri);outline-offset:-1px}
.worked{background:color-mix(in srgb,var(--pri) 10%,var(--card));border-radius:12px;padding:10px 12px;margin:10px 0}.worked p{margin:4px 0 0}
/* Ночной режим: красный на чёрном, не слепит */
body.night{--bg:#000;--card:#0c0202;--ink:#ff6b5b;--muted:#b4483d;--line:#2a0b08;--pri:#ff6b5b;--top:#000;--top2:#0c0202;--good:#ff6b5b;--ok:#d9534a;--bad:#a8322a;--no:#6b2a24;
  --tg-bg:#1f0705;--tg:#ff8a7d;--tb-bg:#1f0705;--tb:#ff8a7d;--shadow:none;--warn-bg:#1f0705;--warn-ink:#ff8a7d;color-scheme:dark}

body.night .seg button{color:#b4483d}body.night .seg button.on{border-bottom-color:#ff6b5b}
body.night .chip{border-color:#3a0f0b;background:#0c0202}body.night .chip.on{background:#ff6b5b;color:#000;border-color:#ff6b5b}
body.night .top .sub,body.night .top .link{color:#b4483d}body.night .ring svg{filter:none!important}
